*{box-sizing:border-box}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.grid .card{margin:0}
.stat{font-size:28px;font-weight:700;color:var(--brand)}
.muted{color:var(--muted);font-size:14px}
button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px;border-radius:12px;font-size:15px;cursor:pointer;margin:3px 3px 3px 0;font-family:inherit}
button.on,button.p{background:var(--brand);color:#fff;border-color:var(--brand)}
button.ok{border-color:var(--ok);border-width:2px}button.bad{border-color:var(--bad);border-width:2px}
button:disabled{opacity:.55;cursor:default}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;margin-bottom:8px}
.big{font-size:32px;font-weight:700}.c{text-align:center}
.right{color:var(--ok);font-weight:600}.wrong{color:var(--bad);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
a.b{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px;border-radius:12px;font-size:15px;margin:3px 3px 3px 0;text-decoration:none}

["a-an-the","A0","Mạo từ a / an / the","Mạo từ đứng trước danh từ. “A/an” dùng cho một thứ chưa xác định (nhắc lần đầu). “The” dùng khi người nghe đã biết đó là thứ nào. Không dùng mạo từ trước danh từ số nhiều hoặc không đếm được khi nói chung.",["a + danh từ số ít bắt đầu bằng âm phụ âm: a book, a university","an + âm nguyên âm (xét âm, không xét chữ): an apple, an hour","the + thứ đã xác định hoặc duy nhất: the sun, the book on the table"],[["I have a dog. The dog is black.","Tôi có một con chó. Con chó đó màu đen."],["She is an engineer.","Cô ấy là một kỹ sư."],["Close the door, please.","Làm ơn đóng cửa lại."]],["Sai: I am student. → Đúng: I am a student.","Sai: She is a engineer. → Đúng: She is an engineer.","Sai: I like the music. (nói chung) → Đúng: I like music."],[["I eat ___ apple every day.",["a","an","the"],1,"“apple” bắt đầu bằng âm nguyên âm nên dùng “an”."],["___ sun rises in the east.",["A","An","The"],2,"Mặt trời là duy nhất nên dùng “the”."],["He is ___ honest man.",["a","an","the"],1,"“honest” có âm đầu là nguyên âm (h câm) nên dùng “an”."],["I bought a shirt. ___ shirt is blue.",["A","An","The"],2,"Cái áo đã được nhắc ở câu trước nên dùng “The”."]]],
["plural","A0","Danh từ số nhiều, đếm được và không đếm được","Danh từ đếm được có số ít và số nhiều. Thường thêm -s; thêm -es sau s, x, ch, sh, o; phụ âm + y đổi thành -ies. Danh từ không đếm được (water, rice, money, advice, information) không có số nhiều và không dùng a/an.",["Thường: book → books","s/x/ch/sh/o + es: box → boxes, watch → watches","phụ âm + y → ies: city → cities","Bất quy tắc: man → men, woman → women, child → children, foot → feet, person → people","Không đếm được: some water, much money, a piece of advice"],[["I have two brothers.","Tôi có hai anh/em trai."],["There are three children in the room.","Có ba đứa trẻ trong phòng."],["I need some information.","Tôi cần một ít thông tin."]],["Sai: two childs → Đúng: two children","Sai: an information → Đúng: some information","Sai: I have many moneys. → Đúng: I don’t have much money."],[["There are five ___ in the class.",["student","students","studentes"],1,"Số nhiều của student là students."],["She has two ___.",["babys","babies","babyes"],1,"Phụ âm + y: bỏ y thêm -ies → babies."],["I need some ___.",["advice","advices","an advice"],0,"“advice” không đếm được: không thêm -s, không dùng an."],["Many ___ live in this city.",["people","person","persons"],0,"“people” là số nhiều của person, đi với động từ số nhiều."]]],
["pronouns","A0","Đại từ nhân xưng và tính từ sở hữu","Đại từ chủ ngữ (I, you, he, she, it, we, they) đứng trước động từ. Đại từ tân ngữ (me, you, him, her, it, us, them) đứng sau động từ hoặc giới từ. Tính từ sở hữu (my, your, his, her, its, our, their) đứng trước danh từ.",["Chủ ngữ + động từ: She likes tea.","Động từ + tân ngữ: I like her.","Tính từ sở hữu + danh từ: my phone, their house","I → me → my; he → him → his; she → her → her; they → them → their"],[["They are my friends. I like them.","Họ là bạn của tôi. Tôi quý họ."],["This is her bag.","Đây là túi của cô ấy."],["Can you help us?","Bạn giúp chúng tôi được không?"]],["Sai: Me am a student. → Đúng: I am a student.","Sai: He likes she. → Đúng: He likes her.","Sai: This is me book. → Đúng: This is my book."],[["___ is my sister.",["She","Her","Hers"],0,"Làm chủ ngữ phải dùng “She”."],["I love my parents. I love ___.",["they","them","their"],1,"Làm tân ngữ dùng “them”."],["This is ___ car. (xe của anh ấy)",["he","him","his"],2,"Trước danh từ dùng tính từ sở hữu “his”."],["Please call ___.",["I","my","me"],2,"Sau động từ cần tân ngữ “me”."]]],
["this-there","A0","This / that / these / those và There is / are","This/these chỉ vật ở gần, that/those chỉ vật ở xa. This/that đi với số ít, these/those đi với số nhiều. “There is / There are” dùng để nói có cái gì ở đâu.",["This / That + is + danh từ số ít","These / Those + are + danh từ số nhiều","There is + a/an + danh từ số ít (hoặc không đếm được)","There are + danh từ số nhiều","Phủ định: There isn’t / There aren’t. Nghi vấn: Is there ...? / Are there ...?"],[["This is my pen, and that is your pen.","Đây là bút của tôi, kia là bút của bạn."],["There is a cat under the table.","Có một con mèo dưới bàn."],["Are there any eggs?","Có quả trứng nào không?"]],["Sai: There is two chairs. → Đúng: There are two chairs.","Sai: These is my book. → Đúng: This is my book.","Sai: Have a bank near here. → Đúng: There is a bank near here."],[["___ are my shoes. (ở gần tôi)",["This","That","These"],2,"Số nhiều, ở gần: these."],["There ___ a park near my house.",["is","are","am"],0,"“a park” số ít nên dùng is."],["There ___ many people here.",["is","are","be"],1,"“many people” số nhiều nên dùng are."],["___ is your bag over there.",["This","That","These"],1,"Ở xa, số ít: that."]]],
["pres-cont","A1","Thì hiện tại tiếp diễn","Nói về việc đang xảy ra ngay lúc nói, hoặc kế hoạch chắc chắn trong tương lai gần. Cấu trúc: am/is/are + V-ing. Bỏ e cuối trước khi thêm -ing (make → making); gấp đôi phụ âm với từ ngắn (run → running). Động từ chỉ trạng thái như know, like, want không dùng thì này.",["(+) S + am/is/are + V-ing","(–) S + am/is/are + not + V-ing","(?) Am/Is/Are + S + V-ing?","Dấu hiệu: now, at the moment, right now, Look!, Listen!"],[["I am studying English now.","Bây giờ tôi đang học tiếng Anh."],["She isn’t working today.","Hôm nay cô ấy không làm việc."],["Are they playing football?","Họ đang chơi bóng đá à?"],["We are meeting him tomorrow.","Ngày mai chúng tôi gặp anh ấy. (kế hoạch)"]],["Sai: I am study now. → Đúng: I am studying now.","Sai: He is have lunch. → Đúng: He is having lunch.","Sai: I am knowing the answer. → Đúng: I know the answer."],[["Look! The baby ___.",["sleeps","is sleeping","sleeping"],1,"“Look!” báo hiệu việc đang xảy ra: is sleeping."],["They ___ TV at the moment.",["watch","are watching","watches"],1,"“at the moment” → are watching."],["He is ___ a letter.",["write","writeing","writing"],2,"Bỏ e rồi thêm -ing: writing."],["___ you listening to me?",["Do","Are","Is"],1,"Với you dùng Are."]]],
["past-simple","A1","Thì quá khứ đơn","Nói về hành động đã xảy ra và kết thúc trong quá khứ. Động từ có quy tắc thêm -ed; động từ bất quy tắc phải học thuộc. Phủ định và nghi vấn dùng did + động từ nguyên mẫu.",["(+) S + V-ed / V2","(–) S + didn’t + V (nguyên mẫu)","(?) Did + S + V (nguyên mẫu)?","Dấu hiệu: yesterday, last week, two days ago, in 2020","Bất quy tắc: go–went, have–had, do–did, see–saw, buy–bought, eat–ate, take–took"],[["I visited my grandmother yesterday.","Hôm qua tôi đã thăm bà."],["She didn’t go to school last Monday.","Thứ Hai tuần trước cô ấy không đi học."],["Did you buy a new phone?","Bạn đã mua điện thoại mới à?"]],["Sai: I didn’t went there. → Đúng: I didn’t go there.","Sai: Did she came? → Đúng: Did she come?","Sai: He goed home. → Đúng: He went home."],[["We ___ a movie last night.",["watch","watched","watching"],1,"“last night” → quá khứ: watched."],["She ___ to Da Nang two years ago.",["go","goes","went"],2,"go là động từ bất quy tắc: went."],["I didn’t ___ breakfast this morning.",["have","had","having"],0,"Sau didn’t dùng động từ nguyên mẫu: have."],["___ you see him yesterday?",["Do","Did","Were"],1,"Câu hỏi quá khứ dùng Did."]]],
["future","A1","Tương lai: will và be going to","Will dùng cho quyết định tức thời, dự đoán, lời hứa. Be going to dùng cho kế hoạch đã có hoặc dự đoán có căn cứ.",["will + V (nguyên mẫu); phủ định: won’t = will not","am/is/are + going to + V","Dấu hiệu: tomorrow, next week, soon, in 2030"],[["I’m cold. I will close the window.","Tôi lạnh. Tôi sẽ đóng cửa sổ. (quyết định tức thời)"],["We are going to travel to Hue next month.","Tháng sau chúng tôi sẽ đi Huế. (đã có kế hoạch)"],["Look at those clouds. It is going to rain.","Nhìn mây kia kìa. Trời sắp mưa. (có căn cứ)"]],["Sai: I will to go. → Đúng: I will go.","Sai: She will goes. → Đúng: She will go.","Sai: He going to buy a car. → Đúng: He is going to buy a car."],[["“The phone is ringing.” – “I ___ answer it.”",["am going to","will","go"],1,"Quyết định ngay lúc nói: will."],["I ___ visit my aunt this weekend. I already bought the ticket.",["will","am going to","visit"],1,"Đã có kế hoạch: am going to."],["Don’t worry. She ___ be late. She promises.",["won’t","isn’t","doesn’t"],0,"Lời hứa: won’t (will not) be late."],["They are going to ___ a party.",["have","having","has"],0,"Sau going to dùng động từ nguyên mẫu."]]],
["wh-questions","A1","Câu hỏi với What, Where, When, Why, Who, How","Từ để hỏi đứng đầu câu. Sau từ để hỏi dùng trợ động từ (do/does/did hoặc to be) rồi mới đến chủ ngữ. How many dùng với danh từ đếm được, how much với không đếm được.",["Wh- + am/is/are + S ...?","Wh- + do/does/did + S + V ...?","Who/What làm chủ ngữ: Who lives here? (không dùng do/does)","How many + danh từ đếm được; How much + danh từ không đếm được"],[["Where do you live?","Bạn sống ở đâu?"],["What is your name?","Tên bạn là gì?"],["How many brothers do you have?","Bạn có bao nhiêu anh/em trai?"],["Why did she leave?","Tại sao cô ấy rời đi?"]],["Sai: Where you live? → Đúng: Where do you live?","Sai: What does he wants? → Đúng: What does he want?","Sai: How much students? → Đúng: How many students?"],[["___ do you go to work? – By bus.",["What","How","Who"],1,"Hỏi cách thức/phương tiện: How."],["___ is your birthday? – In May.",["Where","When","Why"],1,"Hỏi thời gian: When."],["How ___ water do you drink?",["many","much","few"],1,"water không đếm được: how much."],["Where ___ she work?",["do","does","is"],1,"Chủ ngữ she dùng does."]]],
["prepositions","A1","Giới từ in / on / at","Giới từ chỉ thời gian và nơi chốn. In dùng cho khoảng thời gian dài hoặc không gian rộng/kín, on cho ngày và bề mặt, at cho thời điểm hoặc địa điểm cụ thể.",["Thời gian: in + tháng/năm/mùa/buổi (in May, in 2025, in the morning); on + thứ/ngày (on Monday, on 5 May); at + giờ (at 7 o’clock, at night)","Nơi chốn: in + thành phố/nước/không gian kín (in Hanoi, in the room); on + bề mặt (on the table); at + điểm cụ thể (at the bus stop, at home)"],[["The meeting is on Friday at 9 a.m.","Cuộc họp vào thứ Sáu lúc 9 giờ sáng."],["She lives in Ho Chi Minh City.","Cô ấy sống ở TP. Hồ Chí Minh."],["The keys are on the table.","Chìa khóa ở trên bàn."]],["Sai: at Monday → Đúng: on Monday","Sai: I’m in home. → Đúng: I’m at home.","Lưu ý: in the morning nhưng on Monday morning."],[["I was born ___ 1998.",["in","on","at"],0,"Năm dùng in."],["See you ___ Sunday.",["in","on","at"],1,"Thứ trong tuần dùng on."],["The class starts ___ 8 o’clock.",["in","on","at"],2,"Giờ cụ thể dùng at."],["She is ___ the airport now.",["on","at","to"],1,"Địa điểm cụ thể: at the airport."]]],
["modals","A1","Động từ khuyết thiếu: can, could, must, should","Modal verbs đứng trước động từ nguyên mẫu, không thêm -s, không dùng do/does. Can: khả năng/xin phép. Could: lịch sự. Must: bắt buộc. Should: lời khuyên.",["S + can/could/must/should + V (nguyên mẫu)","Phủ định: can’t, shouldn’t, mustn’t (cấm), don’t have to (không cần)","Nghi vấn: Can/Could/Should + S + V ...?"],[["I can swim, but I can’t dive.","Tôi biết bơi nhưng không biết lặn."],["You should drink more water.","Bạn nên uống nhiều nước hơn."],["Could you open the door, please?","Bạn mở cửa giúp tôi được không?"],["You mustn’t smoke here.","Bạn không được hút thuốc ở đây."]],["Sai: She cans swim. → Đúng: She can swim.","Sai: He should to go. → Đúng: He should go.","Sai: You don’t must run. → Đúng: You mustn’t run."],[["She ___ speak three languages.",["can","cans","is can"],0,"Modal không thêm -s: can."],["You have a fever. You ___ see a doctor.",["can","should","are"],1,"Lời khuyên: should."],["Students ___ use phones in the exam. (bị cấm)",["mustn’t","don’t have to","can"],0,"Cấm đoán: mustn’t."],["___ you help me, please?",["Could","Do","Are"],0,"Nhờ vả lịch sự: Could you ...?"]]],
["pres-perf","A2","Thì hiện tại hoàn thành","Nói về trải nghiệm trong đời, việc bắt đầu trong quá khứ và còn liên quan đến hiện tại, hoặc kết quả ở hiện tại. Cấu trúc: have/has + V3. Không dùng với mốc thời gian đã qua cụ thể (yesterday, in 2019).",["(+) S + have/has + V3","(–) S + haven’t/hasn’t + V3","(?) Have/Has + S + V3?","Dấu hiệu: ever, never, already, yet, just, since + mốc, for + khoảng"],[["I have visited Japan twice.","Tôi đã đến Nhật hai lần."],["She has lived here since 2020.","Cô ấy sống ở đây từ năm 2020."],["Have you ever eaten sushi?","Bạn đã từng ăn sushi chưa?"],["They haven’t finished yet.","Họ vẫn chưa xong."]],["Sai: I have seen him yesterday. → Đúng: I saw him yesterday.","Sai: She has went home. → Đúng: She has gone home.","Sai: I live here since 2020. → Đúng: I have lived here since 2020."],[["I ___ never ___ sushi.",["have / eaten","has / eat","have / ate"],0,"have + V3 (eat – ate – eaten)."],["She ___ here for five years.",["lives","has lived","lived"],1,"Còn kéo dài đến hiện tại với for: has lived."],["We ___ finished the report yet.",["haven’t","didn’t","aren’t"],0,"“yet” + phủ định hiện tại hoàn thành: haven’t."],["He has worked here ___ 2019.",["for","since","in"],1,"Mốc thời gian dùng since."]]],
["comparison","A2","So sánh hơn và so sánh nhất","So sánh hơn dùng cho hai đối tượng, so sánh nhất dùng cho một đối tượng trong nhóm từ ba trở lên. Tính từ ngắn thêm -er/-est; tính từ dài dùng more/most.",["Ngắn: tall → taller than → the tallest","Tận cùng y: easy → easier → the easiest","Dài: beautiful → more beautiful than → the most beautiful","Bất quy tắc: good → better → the best; bad → worse → the worst","Bằng nhau: as + tính từ + as"],[["This bag is cheaper than that one.","Cái túi này rẻ hơn cái kia."],["She is the most intelligent student in the class.","Cô ấy là học sinh thông minh nhất lớp."],["My phone is as expensive as yours.","Điện thoại của tôi đắt bằng của bạn."]],["Sai: more taller → Đúng: taller","Sai: the most good → Đúng: the best","Sai: taller that me → Đúng: taller than me"],[["Hanoi is ___ than Hue in winter.",["cold","colder","coldest"],1,"So sánh hai nơi: colder than."],["This is ___ film I have ever seen.",["better","the best","the most good"],1,"good → better → the best."],["English is ___ than Math for me. (difficult)",["difficulter","more difficult","most difficult"],1,"Tính từ dài: more difficult."],["He runs as ___ as his brother.",["fast","faster","fastest"],0,"as ... as dùng dạng nguyên: fast."]]],
["conditionals","B1","Câu điều kiện loại 1 và loại 2","Loại 1 nói về khả năng có thật ở hiện tại/tương lai. Loại 2 nói về giả định không có thật hoặc khó xảy ra ở hiện tại. Mệnh đề if không dùng will/would; loại 2 dùng were cho mọi ngôi.",["Loại 1: If + S + V (hiện tại), S + will + V","Loại 2: If + S + V2 (quá khứ), S + would + V","Loại 2 với to be: If I were you, I would ...","Có thể đảo vế: S + will + V if + S + V"],[["If it rains, we will stay at home.","Nếu trời mưa, chúng tôi sẽ ở nhà."],["If I had more money, I would buy a house.","Nếu có nhiều tiền hơn, tôi sẽ mua nhà."],["If I were you, I would study harder.","Nếu tôi là bạn, tôi sẽ học chăm hơn."]],["Sai: If it will rain, I will stay. → Đúng: If it rains, I will stay.","Sai: If I would have time, I would go. → Đúng: If I had time, I would go.","Sai: If I was you ... → Đúng: If I were you ..."],[["If you ___ hard, you will pass the exam.",["study","will study","studied"],0,"Loại 1: mệnh đề if dùng hiện tại đơn."],["If I ___ a bird, I would fly to you.",["am","were","will be"],1,"Loại 2 giả định: were."],["If she asks me, I ___ her.",["help","will help","would help"],1,"Loại 1: will + V."],["If we had a car, we ___ to the beach.",["will drive","would drive","drive"],1,"Loại 2: would + V."]]],
["passive","B1","Câu bị động","Câu bị động nhấn mạnh đối tượng chịu tác động, hoặc dùng khi không cần/không biết người thực hiện. Cấu trúc: be + V3, chia be theo thì của câu. Chuyển từ chủ động: tân ngữ thành chủ ngữ, thêm by + tác nhân nếu cần.",["Hiện tại đơn: am/is/are + V3","Quá khứ đơn: was/were + V3","Tương lai: will be + V3","Hiện tại hoàn thành: have/has been + V3","Chủ động → bị động: They built this bridge. → This bridge was built (by them)."],[["English is spoken all over the world.","Tiếng Anh được nói trên khắp thế giới."],["The window was broken yesterday.","Cửa sổ bị vỡ hôm qua."],["The report will be finished tomorrow.","Báo cáo sẽ được hoàn thành vào ngày mai."]],["Sai: The house built in 1990. → Đúng: The house was built in 1990.","Sai: It was happened. → Đúng: It happened. (happen không có bị động)","Sai: The cake was ate. → Đúng: The cake was eaten."],[["Rice ___ in Vietnam.",["grows","is grown","is growing"],1,"Gạo được trồng: is grown (bị động hiện tại đơn)."],["This book ___ by a famous writer in 2010.",["wrote","was written","is written"],1,"Quá khứ bị động: was written."],["The room ___ tomorrow.",["will clean","will be cleaned","is cleaned"],1,"Tương lai bị động: will be + V3."],["My phone ___ stolen. I just found out.",["has been","have been","was been"],0,"Hiện tại hoàn thành bị động: has been stolen."]]]
].map(a=>({id:a[0],lv:a[1],title:a[2],ex:a[3],f:a[4],e:a[5],m:a[6],x:a[7].map(q=>({q:q[0],o:q[1],a:q[2],w:q[3]}))}));

].concat(G2).sort((a,b)=>"A0A1A2B1B2".indexOf(a.lv)-"A0A1A2B1B2".indexOf(b.lv));
const LV=["A0","A1","A2","B1","B2"];
const $=s=>document.querySelector(s);
let S=null;try{S=JSON.parse(localStorage.getItem("em2")||"null")}catch(e){}
S=S||{prog:{},exams:[],theme:null};
{const o=S.prog;S.prog={};for(const k in o)S.prog[k.toLowerCase()]=o[k];S.gram=S.gram||{}}
const save=()=>{try{localStorage.setItem("em2",JSON.stringify(S))}catch(e){}};
if(S.theme)document.documentElement.dataset.theme=S.theme;
const isDark=()=>(document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))==="dark";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const day=()=>new Date().toDateString();
function speak(t,r){if(!("speechSynthesis" in window))return;const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r||.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
function review(p,q){let{reps,iv,ease}=p;if(q===0){reps=0;iv=0;ease=Math.max(1.3,ease-.2)}else{reps++;iv=reps===1?(q===2?3:1):Math.round(Math.max(1,iv)*ease*(q===2?1.3:1));if(q===2)ease+=.1}
return{...p,reps,iv,ease,due:Date.now()+(q===0?600000:iv*864e5),upd:day()}}
const P=w=>S.prog[w]||{reps:0,iv:0,ease:2.3,due:0,fav:false,upd:null};

let vm="card",tab="home",topic="all",favOnly=false,flip=false,gOpen="be",gAns={},ex=null,sw=V[0],heard="",score=null,rec=false,err="";
const TABS=[["home","Tổng quan"],["vocab","Từ vựng"],["gram","Ngữ pháp"],["speak","Nói"],["exam","Thi thử"]];
const go=t=>{tab=t;if(t==="exam"&&!ex)newExam();render()};
function toggleTheme(){S.theme=isDark()?"light":"dark";document.documentElement.dataset.theme=S.theme;save();render()}

function home(){
 const now=Date.now(),pr=Object.values(S.prog);
 const learned=pr.filter(p=>p.reps>0).length,due=pr.filter(p=>p.upd&&p.due<=now).length,fav=pr.filter(p=>p.fav).length,today=pr.filter(p=>p.upd===day()).length;
 return `<div class="card"><h2>Chào mừng bạn!</h2><p class="muted">Mục tiêu hôm nay: học 10 từ. Đã học: ${today}/10.</p><button class="p" onclick="go('vocab')">Học từ vựng ngay</button></div>
 <div class="grid"><div class="card"><div class="stat">${learned}</div>từ đã học</div><div class="card"><div class="stat">${due}</div>từ cần ôn</div><div class="card"><div class="stat">${fav}</div>từ yêu thích</div><div class="card"><div class="stat">${V.length}</div>mục từ, ${new Set(V.map(w=>w.k)).size} từ khác nhau, ${V.filter(w=>w.em).length} mục có hình</div></div>
 <div class="card" style="margin-top:14px"><h3>Lộ trình</h3><p>Ngữ pháp: đã hoàn thành ${Object.keys(S.gram).length}/${G.length} bài.</p><p class="muted">${V.filter(w=>!w.lv).length} từ chưa phân cấp độ A0–B2, đang xếp theo chủ đề.</p>${LV.map(l=>{const n=V.filter(w=>w.lv===l).length;return `<p><b>${l}</b>: ${n?n+" từ vựng đã có":"Chưa có nội dung (đang phát triển)"}</p>`}).join("")}</div>
 <div class="card"><h3>Lịch sử thi thử</h3>${S.exams.length?S.exams.slice(0,5).map(e=>`<p>${new Date(e.at).toLocaleString("vi-VN")}: <b>${e.s}/${e.t}</b></p>`).join(""):'<p class="muted">Chưa có bài thi nào.</p>'}</div>
 <p class="muted">Dữ liệu được lưu trên trình duyệt này; đổi thiết bị hoặc xóa dữ liệu trình duyệt sẽ mất tiến độ.</p>`}

function vocab(){
 const now=Date.now();
 const L=V.filter(w=>(topic==="all"||w.t===topic)&&(!favOnly||P(w.k).fav));
 const q=L.filter((w,i,a)=>a.findIndex(x=>x.k===w.k)===i&&(!S.prog[w.k]||S.prog[w.k].due<=now));
 const w=q[0];
 let h=`<div class="card"><select onchange="topic=this.value;flip=false;render()"><option value="all">Tất cả chủ đề</option>${TOPICS.map(t=>`<option value="${t}" ${t===topic?"selected":""}>${t} (${V.filter(x=>x.t===t).length})</option>`).join("")}</select>
 <label><input type="checkbox" ${favOnly?"checked":""} onchange="favOnly=this.checked;flip=false;render()"> Chỉ từ yêu thích</label><br><button class="${vm==="card"?"on":""}" onclick="vm='card';render()">Flashcard</button><button class="${vm==="list"?"on":""}" onclick="vm='list';render()">Danh sách</button><p class="muted">${vm==="list"?"Đang hiển thị "+L.length+" mục":"Còn "+q.length+" từ cần học/ôn trong lượt này."}</p></div>`;
 if(vm==="list")return h+listV(L);
 if(!w)return h+`<div class="card c"><h3>🎉 Hết từ cần ôn ở bộ lọc này!</h3><p class="muted">Quay lại sau để ôn theo lịch.</p></div>`;
 const p=P(w.k),i=V.indexOf(w);
 return h+`<div class="card c"><div class="muted">${w.t}${w.lv?" · "+w.lv:""}</div>${w.img?`<div style="font-size:72px;line-height:1.15">${w.img}</div>`:""}${w.em?`<div style="font-size:64px;line-height:1.2">${w.em}</div>`:""}<div class="big">${w.en}</div><div class="muted">${w.ipa}</div>
 <button onclick="speak(V[${i}].en)">🔊 Nghe</button><button onclick="favT(${i})">${p.fav?"★ Đã thích":"☆ Yêu thích"}</button><a class="b" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(w.en)}" target="_blank" rel="noopener">🖼️ Xem ảnh</a>
 ${flip?`<h3>${w.vi}</h3>${w.ex?`<p>${w.ex} <button onclick="speak(V[${i}].ex)">🔊</button></p><p class="muted">${w.exVi}</p><p class="muted">💡 ${w.use}</p>`:""}
 <button class="bad" onclick="rate(${i},0)">Quên</button><button onclick="rate(${i},1)">Nhớ</button><button class="ok" onclick="rate(${i},2)">Dễ</button>`
 :`<div><button class="p" onclick="flip=true;render()">Xem nghĩa</button></div>`}</div>`}
function listV(L){let t="",o="";for(const w of L){const i=V.indexOf(w);if(topic==="all"&&w.t!==t){t=w.t;o+=`<h3 style="margin:14px 0 4px">${t}</h3>`}o+=`<div class="row"><div style="display:flex;gap:10px;align-items:center"><span style="font-size:28px;width:36px;text-align:center">${w.img||""}</span><div>${w.em?w.em+" ":""}<b>${w.en}</b> <span class="muted">${w.ipa}</span><br>${w.vi}</div></div><div><button onclick="speak(V[${i}].en)">🔊</button><button onclick="favT(${i})">${P(w.k).fav?"★":"☆"}</button><a class="b" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(w.en)}" target="_blank" rel="noopener">🖼️</a></div></div>`}return `<div class="card">${o||"Không có từ nào."}</div>`}
function favT(i){const w=V[i].k;const p=P(w);S.prog[w]={...p,fav:!p.fav};save();render()}
function rate(i,k){const w=V[i].k;S.prog[w]=review(P(w),k);save();flip=false;render()}

let gLv="all";
function xsReset(id){G.find(g=>g.id===id).x.forEach((e,i)=>delete gAns[id+i]);render()}
function gram(){
 const l=G.find(g=>g.id===gOpen),xs=l.x,ans=xs.map((e,i)=>gAns[l.id+i]);
 const fin=ans.every(a=>a!==undefined),sc=ans.filter((a,i)=>a===xs[i].a).length;
 if(fin&&(!S.gram[l.id]||S.gram[l.id].s<sc)){S.gram[l.id]={s:sc,t:xs.length};save()}
 const nx=G[G.indexOf(l)+1],list=G.filter(g=>gLv==="all"||g.lv===gLv);
 const pill=v=>`<button class="${gLv===v?"on":""}" onclick="gLv='${v}';render()">${v==="all"?"Tất cả":v}</button>`;
 return `<div class="card">${["all","A0","A1","A2","B1"].map(pill).join("")}<div style="margin-top:6px">${list.map(g=>`<button class="${g.id===gOpen?"on":""}" onclick="gOpen='${g.id}';render()">${S.gram[g.id]?"✓ ":""}${g.lv} · ${g.title}</button>`).join("")}</div><p class="muted">${Object.keys(S.gram).length}/${G.length} bài đã hoàn thành (làm xong phần bài tập).</p></div>
 <div class="card"><h2>${l.title}</h2><p>${l.ex}</p><h3>Công thức</h3><ul>${l.f.map(x=>`<li>${x}</li>`).join("")}</ul>
 <h3>Ví dụ</h3>${l.e.map(x=>`<p><b>${x[0]}</b><br><span class="muted">${x[1]}</span></p>`).join("")}<h3>Lỗi thường gặp</h3><ul>${l.m.map(x=>`<li>${x}</li>`).join("")}</ul></div>
 <div class="card"><h3>Bài tập</h3>${xs.map((e,i)=>{const k=l.id+i,a=gAns[k];return `<div style="margin-bottom:12px"><b>${i+1}. ${e.q}</b><br>${e.o.map((o,j)=>`<button ${a!==undefined?"disabled":""} class="${a===undefined?"":j===e.a?"ok":a===j?"bad":""}" onclick="gAns['${k}']=${j};render()">${o}</button>`).join("")}${a!==undefined?`<p class="${a===e.a?"right":"wrong"}">${a===e.a?"Đúng! ":"Chưa đúng. "}${e.w}</p>`:""}</div>`}).join("")}
 ${fin?`<p class="${sc===xs.length?"right":"wrong"}">Kết quả: ${sc}/${xs.length}. ${sc===xs.length?"Xuất sắc!":"Hãy đọc lại phần giải thích rồi làm lại."}</p>`:""}<button onclick="xsReset('${l.id}')">Làm lại</button>${nx?`<button class="p" onclick="gOpen='${nx.id}';scrollTo(0,0);render()">Bài tiếp: ${nx.title}</button>`:""}</div>`}

const norm=s=>s.toLowerCase().replace(/[^a-z’' ]/g,"").replace(/’/g,"'").split(/\s+/).filter(Boolean);
function speakV(){
 return `<div class="card c"><p class="muted">Đọc to câu sau bằng tiếng Anh (cần Chrome/Edge và cho phép micro)</p><div class="big">${w_()}</div><p class="muted">${sw.exVi}</p>
 <button onclick="speak(sw.ex,.8)">🔊 Nghe mẫu</button><button class="p" ${rec?"disabled":""} onclick="startRec()">${rec?"Đang nghe...":"🎤 Bắt đầu nói"}</button><button onclick="sw=(a=>a[Math.floor(Math.random()*a.length)])(V.filter(x=>x.ex));heard='';score=null;err='';render()">Câu khác</button>
 ${err?`<p class="wrong">${esc(err)}</p>`:""}${heard?`<p>Bạn nói: <b>${esc(heard)}</b></p>`:""}${score!==null?`<p class="${score>=80?"right":"wrong"}">Khớp ${score}% số từ. ${score>=80?"Rất tốt!":"Hãy nghe mẫu rồi thử lại."}</p>`:""}
 <p class="muted">Đây là so khớp từ theo nhận diện của trình duyệt, chưa phải chấm phát âm chi tiết.</p></div>`}
const w_=()=>sw.ex;
function startRec(){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R){err="Trình duyệt chưa hỗ trợ nhận giọng nói. Hãy dùng Chrome hoặc Edge.";return render()}
 err="";heard="";score=null;rec=true;render();
 const r=new R();r.lang="en-US";
 r.onresult=e=>{heard=e.results[0][0].transcript;const t=norm(sw.ex),s=norm(heard);score=Math.round(t.filter(x=>s.includes(x)).length/t.length*100)};
 r.onerror=e=>{err="Không dùng được micro ("+e.error+"). Hãy cho phép micro hoặc mở trang ở tab riêng."};
 r.onend=()=>{rec=false;render()};
 try{r.start()}catch(e){rec=false;err="Không bật được micro.";render()}}

function newExam(){
 const qs=[];
 shuf(V.filter((w,i,a)=>a.findIndex(x=>x.k===w.k)===i)).slice(0,6).sort((x,y)=>!!y.img-!!x.img).map((w,i)=>w).forEach((w,i)=>{const ds=[];for(const x of shuf(V.filter(x=>x.vi!==w.vi&&x.en.toLowerCase()!==w.en.toLowerCase()))){if(ds.length<3&&!ds.some(d=>d.vi===x.vi||d.en.toLowerCase()===x.en.toLowerCase()))ds.push(x)}const o=shuf([w,...ds]);
  if(w.img&&i%3===1)qs.push({q:"Hình này là từ nào?",img:w.img,o:o.map(x=>x.en),a:o.indexOf(w),w:`Từ đúng: ${w.en} ${w.ipa} (${w.vi}).`});else if(i%2===0)qs.push({q:`“${w.en}” nghĩa là gì?`,o:o.map(x=>x.vi),a:o.indexOf(w),w:`${w.en} ${w.ipa} = ${w.vi}. Ví dụ: ${w.ex}`});
  else qs.push({q:"Nghe và chọn từ bạn nghe được",au:w.en,o:o.map(x=>x.en),a:o.indexOf(w),w:`Từ đúng: ${w.en} ${w.ipa} (${w.vi}).`})});
 shuf(G.flatMap(g=>g.x)).slice(0,4).forEach(e=>{const o=shuf(e.o.map((t,i)=>({t,c:i===e.a})));qs.push({q:e.q,o:o.map(x=>x.t),a:o.findIndex(x=>x.c),w:e.w})});
 ex={qs:shuf(qs),ans:[],done:false};ex.ans=ex.qs.map(()=>-1)}
function pick(i,j){ex.ans[i]=j;render()}
function submitExam(){ex.done=true;const s=ex.qs.filter((q,i)=>ex.ans[i]===q.a).length;S.exams.unshift({s,t:ex.qs.length,at:Date.now()});S.exams=S.exams.slice(0,50);save();render()}
function exam(){
 const s=ex.qs.filter((q,i)=>ex.ans[i]===q.a).length;
 return (ex.done?`<div class="card c"><div class="stat">${s}/${ex.qs.length}</div><button class="p" onclick="newExam();render()">Làm đề mới</button></div>`:"")+
 ex.qs.map((q,i)=>`<div class="card">${q.img?`<div style="font-size:64px;text-align:center">${q.img}</div>`:""}<b>${i+1}. ${q.q}</b> ${q.au?`<button onclick="speak('${q.au}')">🔊 Phát</button>`:""}<div>${q.o.map((o,j)=>`<button ${ex.done?"disabled":""} class="${ex.done?(j===q.a?"ok":ex.ans[i]===j?"bad":""):ex.ans[i]===j?"on":""}" onclick="pick(${i},${j})">${o}</button>`).join("")}</div>${ex.done&&ex.ans[i]!==q.a?`<p class="wrong">${q.w}</p>`:""}</div>`).join("")+
 (ex.done?"":`<button class="p" onclick="submitExam()">Nộp bài</button>`)}

function render(){
 $("#nav").innerHTML=`<b>📘 English Master</b>`+TABS.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")+`<button onclick="toggleTheme()">${isDark()?"☀️ Sáng":"🌙 Tối"}</button>`;
 $("#app").innerHTML={home,vocab,gram,speak:speakV,exam}[tab]();
}
render();
</script></body></html>
